aid: osmos
name: Osmos
description: >-
  Osmos is an AI-powered data ingestion and data onboarding platform that helps
  companies import, clean, transform, and validate data arriving from customers,
  partners, and third-party sources. Its core products include the Osmos Uploader,
  an embeddable data-import experience that lets end users upload spreadsheets and
  CSV files that are automatically mapped, validated, and cleaned; AI Data Wrangler
  capabilities that use AI agents to reshape messy inbound data into a target
  schema; and data pipelines for recurring ingestion from files, APIs, and other
  systems. Osmos is aimed at product and data teams that need to reliably onboard
  external data without building and maintaining bespoke import tooling. This
  API Evangelist profile was surfaced as a portfolio company of Lightspeed Venture
  Partners and enriched through the enrichment pipeline; public API surface details
  are gated behind the Osmos application and documentation.
